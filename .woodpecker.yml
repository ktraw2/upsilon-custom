clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

pipeline:
- name: purge-cache
  image: curlimages/curl:7.87.0
  secrets:
  - pull_zone
  - access_key
  commands:
  - "curl -Lsf -X POST https://api.bunny.net/pullzone/$PULL_ZONE/purgeCache -H \"AccessKey: $ACCESS_KEY\" -H 'content-type: application/json' --data '{\"CacheTag\":\"git\"}'"

branches: "trunk"
